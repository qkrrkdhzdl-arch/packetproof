<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Packetproof — seal what you submit</title>
<meta name="description" content="Check a submission packet in the browser: missing files, wrong formats, duplicate attachments, leaked ID numbers — and seal a SHA-256 receipt. No upload, no server." />
<link rel="stylesheet" href="style.css" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23f4f1ea'/%3E%3Cpath d='M11 6h9l4 4v16H11z' fill='none' stroke='%23a33223' stroke-width='2'/%3E%3C/svg%3E" />
</head>
<body>
<header class="masthead">
  <div class="brand">
    <div class="mark" aria-hidden="true">
      <svg viewBox="0 0 32 32" width="34" height="34"><path d="M6 4h14l6 6v18H6z" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"/><path d="M20 4v6h6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"/><circle cx="16" cy="19" r="4.2" fill="none" stroke="currentColor" stroke-width="2"/><path d="M14 25l1.6 2.2L19 21" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    </div>
    <div>
      <h1>Packetproof</h1>
      <p class="tagline" data-i18n="tagline">Seal what you submit.</p>
    </div>
  </div>
  <div class="brand-right">
    <span class="pill" id="privacy-pill" data-i18n="privacy">100% local · no upload</span>
    <button class="btn tiny lang" id="lang-btn" type="button">한국어</button>
    <a class="ghost-link" href="https://github.com/qkrrkdhzdl-arch/packetproof" target="_blank" rel="noopener">GitHub</a>
  </div>
</header>

<main>
  <section class="intro">
    <p data-i18n-html="intro"></p>
  </section>

  <div class="grid">
    <!-- checklist -->
    <section class="card" id="checklist-card">
      <div class="card-head">
        <h2 data-i18n="step1">1 · what has to be inside</h2>
        <select id="preset-select" aria-label="checklist preset"></select>
      </div>
      <p class="hint" data-i18n="step1hint"></p>
      <div class="table-wrap">
        <table class="checklist" id="checklist-table">
          <thead>
            <tr>
              <th data-i18n="colItem">item</th>
              <th data-i18n="colReq">required</th>
              <th data-i18n="colExt">formats</th>
              <th data-i18n="colMax">max</th>
              <th></th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
      <div class="row-actions">
        <button class="btn small" id="add-item" data-i18n="addItem">+ item</button>
        <label class="total-field"><span data-i18n="totalLimit">packet limit</span>
          <input type="number" id="total-mb" min="1" max="2000" step="1" /> MB
        </label>
      </div>
      <div class="packet-name">
        <label><span data-i18n="packetName">packet name</span>
          <input type="text" id="packet-name" data-i18n-ph="packetPlaceholder" placeholder="e.g. 2026 Youth Grant application" />
        </label>
      </div>
    </section>

    <!-- files -->
    <section class="card" id="files-card">
      <div class="card-head">
        <h2 data-i18n="step2">2 · what you are sending</h2>
        <div class="row-actions">
          <button class="btn small" id="sample-btn" data-i18n="sample">Open sample packet</button>
          <button class="btn small ghost" id="clear-btn" data-i18n="clear">Clear</button>
        </div>
      </div>
      <div id="dropzone" class="dropzone" tabindex="0" role="button" aria-label="drop files, a folder or a ZIP">
        <div class="dz-inner">
          <svg viewBox="0 0 24 24" width="26" height="26" aria-hidden="true"><path d="M12 16V4m0 0L7 9m5-5l5 5M4 17v2a2 2 0 002 2h12a2 2 0 002-2v-2" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <strong data-i18n="dzTitle">Folder · files · ZIP here</strong>
          <span data-i18n="dzSub"></span>
        </div>
        <input type="file" id="file-input" multiple hidden />
        <input type="file" id="folder-input" webkitdirectory directory multiple hidden />
      </div>
      <div class="row-actions sub">
        <button class="btn tiny" id="pick-files" data-i18n="pickFiles">Choose files</button>
        <button class="btn tiny" id="pick-folder" data-i18n="pickFolder">Choose folder</button>
        <label class="tiny-label"><span data-i18n="prevSeal">Load a previous seal</span> <input type="file" id="prev-manifest" accept="application/json" /></label>
      </div>
      <div id="files-list" class="files"></div>
    </section>
  </div>

  <!-- verdict -->
  <section class="card" id="result-card">
    <div class="card-head">
      <h2 data-i18n="step3">3 · can you send it</h2>
      <div class="verdict-badge" id="verdict" data-state="empty">waiting</div>
    </div>
    <div id="findings" class="findings"></div>
    <div class="seal-row">
      <button class="btn primary" id="seal-btn" disabled data-i18n="seal">Seal it and get a receipt</button>
      <span class="hint" id="seal-hint"></span>
    </div>
    <div id="receipt" class="receipt" hidden></div>
  </section>
</main>

<footer>
  <p data-i18n-html="footer1"></p>
  <p class="muted"><span data-i18n="footer2">GenHacks 2026 entry · source · MIT</span></p>
</footer>

<script type="module" src="app.js"></script>
</body>
</html>
